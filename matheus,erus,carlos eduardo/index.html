<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição para o Show metalheros do sucesso</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #7ed40d;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background: #fff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #6366f1;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #000000;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Inscrição / Reserva - Show</h2>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="calsinhapreta@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="telefone">Telefone / WhatsApp:</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(32) 24188-9999" required>
            </div>

            <div class="form-group">
                <label for="ingressos">Tipo de Ingresso:</label>
                <select id="ingressos" name="ingressos" required>
                    <option value="">Selecione...</option>
                    <option value="pista">Pista</option>
                    <option value="vip">Área VIP</option>
                    <option value="camarote">Camarote</option>
                </select>
            </div>

            <button type="submit">Confirmar Inscrição</button>
        </form>
    </div>

</body>
</html>
